<!DOCTYPE html>
<html lang="en">
<head>
    <!-- define a estrutura e as configurações iniciais da página -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- importa os ícones utilizados no projeto -->
    <link rel="stylesheet" href='https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css'>
    <!-- conecta o arquivo de estilização da página -->
    <link rel="stylesheet" href="style2.css">
</head>

<body>
    <main>
        <div class="container">
            <!-- adiciona a imagem do cabeçalho e o título do projeto -->
            <img src="header.png" alt="header-do-site-controle-de-finanças" class="header-img">
            <h1>𝘚𝘦𝘶 𝘤𝘰𝘯𝘵𝘳𝘰𝘭𝘦 𝘍𝘪𝘯𝘢𝘯𝘤𝘦𝘪𝘳𝘰!</h1>

            <!-- reúne os campos utilizados para adicionar uma nova movimentação -->
            <div class="newItem">
                <div class="divDesc">
                    <label for="desc">Descrição</label>
                    <input type="text" id="desc" placeholder="Digite a descrição"/>
                </div>

                <div class="divAmount">
                    <label for="amount">Valor</label>
                    <input type="number" id="amount" placeholder="Digite o valor"/>
                </div>

                <div class="divType">
                    <label for="type">Tipo</label>
                    <select id="type">
                        <option>Entrada</option>
                        <option>Saída</option>
                    </select>
                </div>

                <!-- permite selecionar a categoria da movimentação -->
                <div class="divCategory">
                    <label for="category">Categoria</label>
                    <select id="category">
                        <option value="comida">Alimentação</option>
                        <option value="transporte">Transporte</option>
                        <option value="entretenimento">Entretenimento</option>
                        <option value="saúde">Saúde</option>
                        <option value="educação">Educação</option>
                        <option value="moradia">Moradia</option>
                        <option value="contas e serviços">Contas e Serviços</option>
                        <option value="renda extra">Renda Extra</option>
                        <option value="outros">Outros</option>
                    </select>
                </div>

                <!-- botão responsável por adicionar a movimentação -->
                <button id="addBtn">Adicionar</button>
            </div>

            <!-- apresenta o resumo dos valores de entrada, saída e total -->
            <div class="resume">
                <div>
                    Entradas: R$
                    <span class="incomes">0.00</span>
                </div>

                <div>
                    Saídas: R$
                    <span class="expenses">0.00</span>
                </div>

                <div>
                    Total: R$
                    <span class="total">0.00</span>
                </div>
            </div>

            <!-- organiza as movimentações adicionadas em uma tabela -->
            <div class="divTable">
                <table>
                    <thead>
                        <tr>
                            <th>Descrição</th>
                            <th class="columnAmount">Valor</th>
                            <th class="columnType">Tipo</th>
                            <th class="columnAction"></th>
                            <th class="columnCategory">Categoria</th>
                        </tr>
                    </thead>
                    <!-- recebe as movimentações adicionadas pelo usuário -->
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- conecta o arquivo javascript responsável pelas funcionalidades -->
    <script src="script2.js"></script>
</body>
</html>
